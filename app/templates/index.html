<!DOCTYPE html>
<html>
<head>
    <title>Chat Bot User Interface</title>
    <link rel="stylesheet" type="text/css" href="/static/css/style.css">
    <script type="text/javascript" src="https://code.jquery.com/jquery-2.1.4.js"></script>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <script src="https://libs.baidu.com/jquery/2.1.1/jquery.min.js"></script>
    <script type="text/javascript" src="/static/js/firebase.js"></script>
    <script type="text/javascript" src="/static/js/credentials.js"></script>

</head>

<body>

<div class="headerBar">
    <div class="user-photo"><img src="/static/images/ana.JPG"></div>
    <p class="title">聊天</p>
</div>

<div class="chatbox">

    <div class="chatlogs">

        <div class="chat friend">
            <div class="user-photo"><img src="/static/images/ana.JPG"></div>
            <p class="chat-message">你好，我是您的智能助手，有问题可以随时问我哦~</p>
        </div>

        <div class="chat friend" id="loadingGif" style="display: none;">
            <div class="user-photo"><img src="/static/images/ana.JPG"></div>
            <div class="gif"><img src="/static/images/loading.gif"></div>
        </div>

    </div>
</div>
<div class="chat-form">
    <div id="inputDiv">
        <div id="buttonDiv"></div>
        <textarea class="input" placeholder="有问题尽快问我~" rows="1" data-min-rows='1'></textarea>
    </div>
    <div id="chat-form-buttons">
        <input type="image" src="/static/images/keyboard.png" id="switchInputType"/>
    </div>
</div>


<script type="text/javascript" src="/static/js/index.js"></script>
</body>

</html>
